<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>フットワーク練習アプリ</title>
<style>
  body {
    background-color: #1a1a1a;
    color: white;
    font-family: sans-serif;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .screen { display: none; width: 100%; max-width: 400px; }
  .screen.active { display: block; }
  
  h2 { text-align: center; color: #4CAF50; }
  
  /* フォーム・ボタン系 */
  input, select, button {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    box-sizing: border-box;
    font-size: 1.1rem;
    border-radius: 8px;
    border: none;
  }
  button.primary { background-color: #4CAF50; color: white; font-weight: bold; cursor: pointer; }
  button.danger { background-color: #f44336; color: white; font-weight: bold; cursor: pointer; }
  button.secondary { background-color: #555; color: white; cursor: pointer; }
  
  /* ダッシュボード（履歴） */
  .stats-box { background: #333; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center;}
  .history-list { background: #222; padding: 10px; border-radius: 8px; max-height: 200px; overflow-y: auto; }
  .history-item { border-bottom: 1px solid #444; padding: 8px 0; font-size: 0.9rem; }
  
  /* コート */
  .court {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 120px 120px 120px;
    gap: 4px;
    background-color: white;
    padding: 4px;
    border: 4px solid #ff4444;
    border-radius: 8px;
    margin-bottom: 20px;
  }
  .cell {
    background-color: #1b5e20;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 3rem;
    font-weight: bold;
    color: white;
    transition: background-color 0.1s;
  }
  .cell.active { background-color: #f44336; }
  
  .controls { display: flex; gap: 10px; }
  
  /* カウンター表示 */
  #counter-display {
    font-size: 1.8rem;
    font-weight: bold;
    text-align: center;
    margin-bottom: 15px;
    color: #03a9f4;
  }
</style>
</head>
<body>

  <!-- 1. ログイン画面 -->
  <div id="login-screen" class="screen active">
    <h2>プレイヤー選択</h2>
    <input type="text" id="username-input" placeholder="名前を入力してください">
    <button class="primary" onclick="login()">マイページを開く</button>
  </div>

  <!-- 2. マイページ（ダッシュボード） -->
  <div id="dashboard-screen" class="screen">
    <h2 id="welcome-msg"></h2>
    
    <div class="stats-box">
      <p>前回の達成率</p>
      <h3 id="last-score" style="margin: 5px 0; font-size: 2rem; color: #ffeb3b;">-- %</h3>
    </div>

    <button class="primary" onclick="showScreen('training-screen')">トレーニング開始 🏸</button>
    <button class="secondary" onclick="logout()" style="margin-top: 10px;">別のプレイヤーにする</button>

    <h3 style="margin-top: 30px; font-size: 1rem;">過去の履歴</h3>
    <div class="history-list" id="history-container">
      <!-- 履歴がここに入ります -->
    </div>
  </div>

  <!-- 3. トレーニング画面 -->
  <div id="training-screen" class="screen">
    <h2>トレーニング</h2>
    
    <!-- カウンター -->
    <div id="counter-display">0 回</div>

    <div class="court">
      <div class="cell" id="cell-1">1</div><div class="cell" id="cell-4">4</div>
      <div class="cell" id="cell-2">2</div><div class="cell" id="cell-5">5</div>
      <div class="cell" id="cell-3">3</div><div class="cell" id="cell-6">6</div>
    </div>
    
    <div style="display: flex; gap: 10px;">
      <!-- 回数設定 -->
      <select id="countSelect" style="flex: 1;">
        <option value="10">10回</option>
        <option value="20" selected>20回</option>
        <option value="30">30回</option>
        <option value="50">50回</option>
        <option value="0">無限</option>
      </select>

      <select id="speedSelect" style="flex: 1;">
        <option value="1500">遅い (1.5秒)</option>
        <option value="1000" selected>普通 (1.0秒)</option>
        <option value="700">速い (0.7秒)</option>
      </select>
    </div>
    
    <div class="controls">
      <button class="primary" id="startBtn" onclick="startTraining()">スタート</button>
      <button class="danger" id="stopBtn" onclick="stopTraining()">ストップ＆記録</button>
    </div>
    <button class="secondary" onclick="showScreen('dashboard-screen')" style="margin-top: 20px;">戻る</button>
  </div>

<script>
  let currentUser = '';
  let intervalId = null;
  let currentCell = null;
  let count = 0;
  let targetCount = 0;

  // 画面切り替え
  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  // ログイン処理
  function login() {
    const name = document.getElementById('username-input').value.trim();
    if (!name) return alert('名前を入力してください');
    currentUser = name;
    document.getElementById('welcome-msg').innerText = `${currentUser} の記録`;
    loadDashboard();
    showScreen('dashboard-screen');
  }

  // ログアウト処理
  function logout() {
    currentUser = '';
    document.getElementById('username-input').value = '';
    showScreen('login-screen');
  }

  // データ保存・読み込み
  function getHistory() {
    const data = localStorage.getItem('fw_data_' + currentUser);
    return data ? JSON.parse(data) : [];
  }
  
  function saveHistory(score) {
    const history = getHistory();
    const date = new Date().toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    history.unshift({ date: date, score: score });
    localStorage.setItem('fw_data_' + currentUser, JSON.stringify(history));
  }

  // ダッシュボードの表示更新
  function loadDashboard() {
    const history = getHistory();
    const container = document.getElementById('history-container');
    container.innerHTML = '';
    
    if (history.length > 0) {
      document.getElementById('last-score').innerText = history[0].score + ' %';
      history.forEach(item => {
        container.innerHTML += `<div class="history-item">📅 ${item.date} ｜ 達成率: <strong>${item.score}%</strong></div>`;
      });
    } else {
      document.getElementById('last-score').innerText = '-- %';
      container.innerHTML = '<p style="font-size:0.9rem; color:#aaa;">まだ記録がありません</p>';
    }
  }

  // カウンター表示の更新
  function updateCounterDisplay() {
    const display = document.getElementById('counter-display');
    if (targetCount === 0) {
      display.innerText = `${count} 回`;
    } else {
      display.innerText = `${count} / ${targetCount} 回`;
    }
  }

  // 記録入力画面を出す
  function promptAndSave() {
    const score = prompt(`お疲れ様でした！（${count}回）\n今回の達成率（0〜100%）を数字で入力してください。`);
    if (score !== null && score !== "" && !isNaN(score)) {
      saveHistory(score);
      loadDashboard();
      showScreen('dashboard-screen');
    }
  }

  // --- トレーニング機能 ---
  function highlightRandom() {
    count++;
    updateCounterDisplay();

    document.querySelectorAll('.cell').forEach(c => c.classList.remove('active'));
    let random;
    do { random = Math.floor(Math.random() * 6) + 1; } while (random === currentCell);
    currentCell = random;
    document.getElementById('cell-' + random).classList.add('active');

    // 目標回数に達したら自動ストップ
    if (targetCount > 0 && count >= targetCount) {
      clearInterval(intervalId);
      intervalId = null;
      setTimeout(() => {
        document.querySelectorAll('.cell').forEach(c => c.classList.remove('active'));
        currentCell = null;
        promptAndSave();
      }, 500); // 最後のマスを0.5秒見せてから記録画面を出す
    }
  }

  function startTraining() {
    if (intervalId) return; // 既に動いている場合は無視
    
    const speed = parseInt(document.getElementById('speedSelect').value);
    targetCount = parseInt(document.getElementById('countSelect').value);
    count = 0;
    updateCounterDisplay();
    
    highlightRandom(); // 1回目をすぐに表示
    intervalId = setInterval(highlightRandom, speed);
  }

  function stopTraining() {
    if (!intervalId) return;
    clearInterval(intervalId);
    intervalId = null;
    document.querySelectorAll('.cell').forEach(c => c.classList.remove('active'));
    currentCell = null;
    
    promptAndSave();
  }
</script>

</body>
</html>
