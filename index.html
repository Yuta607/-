<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>フットワーク練習アプリ</title>
<style>
  /* 画面全体のデザイン */
  body {
    background-color: #1a1a1a;
    color: white;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 50px;
  }

  /* コートの外枠 */
  .court {
    display: grid;
    grid-template-columns: 120px 120px;
    grid-template-rows: 120px 120px 120px;
    gap: 4px; /* 白線の太さ */
    background-color: white; /* 白線の色 */
    padding: 4px;
    border: 4px solid #ff4444; /* 赤い外枠 */
    border-radius: 8px;
    margin-bottom: 20px;
  }

  /* 1〜6のマス目 */
  .cell {
    background-color: #1b5e20; /* 通常時の緑色 */
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 4rem;
    font-weight: bold;
    color: white;
    transition: background-color 0.1s;
  }

  /* 光った時のマス目 */
  .cell.active {
    background-color: #f44336; /* 光った時の赤色 */
  }

  /* ボタンなどの操作パネル */
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  
  button {
    padding: 10px 20px;
    font-size: 1.2rem;
    font-weight: bold;
    cursor: pointer;
    border: none;
    border-radius: 5px;
  }
  
  #startBtn { background-color: #4CAF50; color: white; }
  #stopBtn { background-color: #f44336; color: white; }
  select { padding: 10px; font-size: 1rem; }
</style>
</head>
<body>

  <h2>フットワーク・トレーニング</h2>

  <!-- コートのレイアウト -->
  <div class="court">
    <div class="cell" id="cell-1">1</div>
    <div class="cell" id="cell-4">4</div>
    <div class="cell" id="cell-2">2</div>
    <div class="cell" id="cell-5">5</div>
    <div class="cell" id="cell-3">3</div>
    <div class="cell" id="cell-6">6</div>
  </div>

  <!-- 操作ボタンと設定 -->
  <div class="controls">
    <button id="startBtn">スタート</button>
    <button id="stopBtn">ストップ</button>
    <select id="speedSelect">
      <option value="1500">遅い (1.5秒)</option>
      <option value="1000" selected>普通 (1.0秒)</option>
      <option value="700">速い (0.7秒)</option>
      <option value="400">鬼速 (0.4秒)</option>
    </select>
  </div>

<script>
  let intervalId;
  let currentCell = null;
  const cells = document.querySelectorAll('.cell');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const speedSelect = document.getElementById('speedSelect');

  // ランダムなマスを光らせる関数
  function highlightRandom() {
    // 全てのマスの赤い色を消す
    cells.forEach(c => c.classList.remove('active'));
    
    let random;
    // 前回と同じ数字が出ないようにする
    do {
      random = Math.floor(Math.random() * 6) + 1;
    } while (random === currentCell);
    
    currentCell = random;
    
    // 選ばれたマスを赤くする
    document.getElementById('cell-' + random).classList.add('active');
  }

  // スタートボタンを押した時の処理
  startBtn.addEventListener('click', () => {
    if (intervalId) return; // 既に動いている場合は無視
    
    const speed = parseInt(speedSelect.value); // 選択されたスピードを取得
    highlightRandom(); // 最初の1回目をすぐに表示
    intervalId = setInterval(highlightRandom, speed); // 設定した間隔で繰り返す
  });

  // ストップボタンを押した時の処理
  stopBtn.addEventListener('click', () => {
    clearInterval(intervalId); // タイマーを止める
    intervalId = null;
    cells.forEach(c => c.classList.remove('active')); // 色をリセット
    currentCell = null;
  });
</script>

</body>
</html>
