<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>フットワーク練習アプリ</title>
<style>
  body {
    background-color: #1a1a1a;
    color: white;
    font-family: sans-serif;
    margin: 0;
    padding: 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .screen { display: none; width: 100%; max-width: 400px; }
  .screen.active { display: block; }
  
  h2 { text-align: center; color: #4CAF50; margin-top: 10px; }
  
  /* フォーム・ボタン系 */
  input, select, button {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    box-sizing: border-box;
    font-size: 1.1rem;
    border-radius: 8px;
    border: none;
  }
  button.primary { background-color: #4CAF50; color: white; font-weight: bold; cursor: pointer; }
  button.danger { background-color: #f44336; color: white; font-weight: bold; cursor: pointer; }
  button.secondary { background-color: #555; color: white; cursor: pointer; }
  
  /* ダッシュボード（履歴） */
  .stats-box { background: #333; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center;}
  .history-list { background: #222; padding: 10px; border-radius: 8px; max-height: 250px; overflow-y: auto; }
  .history-item { border-bottom: 1px solid #444; padding: 10px 0; font-size: 0.95rem; display: flex; flex-direction: column; gap: 5px; }
  
  /* コート・カウンター */
  #counter-display {
    font-size: 1.8rem;
    font-weight: bold;
    text-align: center;
    margin-bottom: 10px;
    color: #03a9f4;
  }
  
  .court-wrapper {
    background-color: #00695c;
    padding: 8px;
    border-radius: 8px;
    margin-bottom: 15px;
  }
  
  /* 3列×3行のリアルなコート配置 */
  .court {
    display: grid;
    grid-template-columns: 1fr 0.6fr 1fr;
    grid-template-rows: 90px 90px 120px;
    gap: 4px;
    background-color: white;
    border: 4px solid white;
  }
  .cell {
    background-color: #1b5e20;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-size: 2rem;
    font-weight: bold;
    color: rgba(255,255,255,0.7);
    transition: background-color 0.1s;
  }
  .cell span { font-size: 0.8rem; font-weight: normal; margin-top: 4px; }
  .cell.active { background-color: #f44336; color: white; }
  .cell.center-mark { background-color: #2e7d32; font-size: 1rem; color: #aaa; }
  
  .flex-row { display: flex; gap: 10px; }
</style>
</head>
<body>

  <!-- 1. ログイン画面 -->
  <div id="login-screen" class="screen active">
    <h2>プレイヤー選択</h2>
    <input type="text" id="username-input" placeholder="名前を入力してください">
    <button class="primary" onclick="login()">マイページを開く</button>
  </div>

  <!-- 2. マイページ（ダッシュボード） -->
  <div id="dashboard-screen" class="screen">
    <h2 id="welcome-msg"></h2>
    
    <div class="stats-box">
      <p>前回の達成率</p>
      <h3 id="last-score" style="margin: 5px 0; font-size: 2rem; color: #ffeb3b;">-- %</h3>
    </div>

    <button class="primary" onclick="showScreen('training-screen')">トレーニング開始 🏸</button>
    <button class="secondary" onclick="logout()" style="margin-top: 10px;">プレイヤー変更</button>

    <h3 style="margin-top: 25px; font-size: 1rem;">過去の履歴</h3>
    <div class="history-list" id="history-container">
      <!-- 履歴がここに入ります -->
    </div>
  </div>

  <!-- 3. トレーニング画面 -->
  <div id="training-screen" class="screen">
    <div id="counter-display">0 回</div>

    <div class="court-wrapper">
      <div class="court">
        <!-- 前衛 -->
        <div class="cell" id="cell-1">1<span>前・左</span></div>
        <div class="cell center-mark"></div>
        <div class="cell" id="cell-4">4<span>前・右</span></div>
        <!-- サイド -->
        <div class="cell" id="cell-2">2<span>左</span></div>
        <div class="cell center-mark">ホーム</div>
        <div class="cell" id="cell-5">5<span>右</span></div>
        <!-- 後衛 -->
        <div class="cell" id="cell-3">3<span>奥・左</span></div>
        <div class="cell center-mark"></div>
        <div class="cell" id="cell-6">6<span>奥・右</span></div>
      </div>
    </div>
    
    <div class="flex-row">
      <select id="countSelect" style="flex: 1;">
        <option value="10">10回</option>
        <option value="20" selected>20回</option>
        <option value="30">30回</option>
        <option value="50">50回</option>
        <option value="0">無限</option>
      </select>

      <select id="speedSelect" style="flex: 1;">
        <option value="2500">2.50秒 (超ワイド)</option>
        <option value="2250">2.25秒</option>
        <option value="2000">2.00秒 (オールコート)</option>
        <option value="1750">1.75秒</option>
        <option value="1500">1.50秒 (ちょい広め)</option>
        <option value="1250">1.25秒</option>
        <option value="1000" selected>1.00秒 (普通)</option>
        <option value="750">0.75秒 (速め)</option>
        <option value="500">0.50秒 (鬼速)</option>
      </select>
    </div>
    
    <div class="flex-row">
      <button class="primary" id="startBtn" onclick="startTraining()">スタート</button>
      <button class="danger" id="stopBtn" onclick="stopTraining()">ストップ</button>
    </div>
    <button class="secondary" onclick="showScreen('dashboard-screen')">戻る</button>
  </div>

<script>
  let currentUser = '';
  let intervalId = null;
  let currentCell = null;
  let count = 0;
  let targetCount = 0;

  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  function login() {
    const name = document.getElementById('username-input').value.trim();
    if (!name) return alert('名前を入力してください');
    currentUser = name;
    document.getElementById('welcome-msg').innerText = `${currentUser} の記録`;
    loadDashboard();
    showScreen('dashboard-screen');
  }

  function logout() {
    currentUser = '';
    document.getElementById('username-input').value = '';
    showScreen('login-screen');
  }

  function getHistory() {
    const data = localStorage.getItem('fw_data_' + currentUser);
    return data ? JSON.parse(data) : [];
  }
  
  function saveHistory(score, playedCount, targetCountStr) {
    const history = getHistory();
    const date = new Date().toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    history.unshift({ date: date, score: score, playedCount: playedCount, targetStr: targetCountStr });
    localStorage.setItem('fw_data_' + currentUser, JSON.stringify(history));
  }

  function loadDashboard() {
    const history = getHistory();
    const container = document.getElementById('history-container');
    container.innerHTML = '';
    
    if (history.length > 0) {
      document.getElementById('last-score').innerText = history[0].score + ' %';
      history.forEach(item => {
        const targetText = item.targetStr === '0' ? '無限' : item.targetStr + '回設定';
        container.innerHTML += `
          <div class="history-item">
            <div>📅 ${item.date} ｜ 達成率: <strong style="color:#4CAF50; font-size:1.1rem;">${item.score}%</strong></div>
            <div style="color:#aaa;">🏃 実施: ${item.playedCount}回 (${targetText})</div>
          </div>`;
      });
    } else {
      document.getElementById('last-score').innerText = '-- %';
      container.innerHTML = '<p style="font-size:0.9rem; color:#aaa;">まだ記録がありません</p>';
    }
  }

  function updateCounterDisplay() {
    const display = document.getElementById('counter-display');
    display.innerText = targetCount === 0 ? `${count} 回` : `${count} / ${targetCount} 回`;
  }

  function promptAndSave() {
    const score = prompt(`お疲れ様でした！（実施：${count}回）\n今回の達成率（0〜100%）を入力してください。`);
    if (score !== null && score !== "" && !isNaN(score)) {
      const targetStr = document.getElementById('countSelect').value;
      saveHistory(score, count, targetStr);
      loadDashboard();
      showScreen('dashboard-screen');
    }
  }

  function highlightRandom() {
    count++;
    updateCounterDisplay();

    document.querySelectorAll('.cell').forEach(c => c.classList.remove('active'));
    let random;
    do { random = Math.floor(Math.random() * 6) + 1; } while (random === currentCell);
    currentCell = random;
    document.getElementById('cell-' + random).classList.add('active');

    if (targetCount > 0 && count >= targetCount) {
      clearInterval(intervalId);
      intervalId = null;
      setTimeout(() => {
        document.querySelectorAll('.cell').forEach(c => c.classList.remove('active'));
        currentCell = null;
        promptAndSave();
      }, 500);
    }
  }

  function startTraining() {
    if (intervalId) return;
    
    const speed = parseInt(document.getElementById('speedSelect').value);
    targetCount = parseInt(document.getElementById('countSelect').value);
    count = 0;
    updateCounterDisplay();
    
    highlightRandom();
    intervalId = setInterval(highlightRandom, speed);
  }

  function stopTraining() {
    if (!intervalId) return;
    clearInterval(intervalId);
    intervalId = null;
    document.querySelectorAll('.cell').forEach(c => c.classList.remove('active'));
    currentCell = null;
    promptAndSave();
  }
</script>

</body>
</html>
